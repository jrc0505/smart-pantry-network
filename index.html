const t=k=>(TX2[S.lang]&&TX2[S.lang][k])||TX[S.lang][k]||TX.en[k]||k;
const stock=p=>S.live[p.id]?S.live[p.id].levels:null;
const ago=ts=>{const m=Math.max(0,Math.round((Date.now()-ts)/6e4)),r=new Intl.RelativeTimeFormat(S.lang,{numeric:'auto'});return m<60?r.format(-m,'minute'):r.format(-Math.round(m/60),'hour')};
const isOpen=p=>{if(!p.hr)return false;const n=new Date(),h=n.getHours()+n.getMinutes()/60;return p.hr.some(b=>b.d.includes(n.getDay())&&h>=b.h[0]&&h<b.h[1])};
const fmtH=h=>new Date(2024,0,1,Math.floor(h),Math.round(h%1*60)).toLocaleTimeString(S.lang,{hour:'numeric',minute:h%1?'2-digit':undefined});
const day=d=>new Date(2024,0,7+d).toLocaleDateString(S.lang,{weekday:'short'});
const dist=p=>{if(!S.pos)return null;const R=3959,r=x=>x*Math.PI/180,a=Math.sin(r(p.la-S.pos.la)/2)**2+Math.cos(r(S.pos.la))*Math.cos(r(p.la))*Math.sin(r(p.lo-S.pos.lo)/2)**2;return 2*R*Math.asin(Math.sqrt(a))};
function hrs(p){if(!p.hr)return t('unk');return p.hr.map(b=>b.d.map(day).join(', ')+' '+fmtH(b.h[0])+'–'+fmtH(b.h[1])).join(' · ')}
function card(p){
 const st=stock(p),o=isOpen(p),dd=dist(p),sv=S.saved.includes(p.id),ex=S.open[p.id];
 const badge=p.hr?`<span class="badge ${o?'open':'closed'}">${o?'● '+t('op'):'○ '+t('cl')}</span>`:`<span class="badge type">☎ ${t('unk')}</span>`;
 const tel=p.ph?`<a href="tel:${p.ph.replace(/[^0-9+]/g,'')}" style="color:var(--brand);font-weight:700">☎ ${p.ph}</a>`:'';
 let h=`<article class="card"><div class="top"><div><h2>${p.n}</h2><div class="meta">${p.c}${dd!=null?' · '+dd.toFixed(1)+' '+t('mi'):''}</div></div><div>${badge}</div></div>
 <div>${S.live[p.id]?`<span class="badge open">✓ ${t('upd')} ${ago(S.live[p.id].ts)}</span>`:''}<span class="badge type">${t(p.t)}</span>${p.ap?`<span class="badge type">${t('appt')}</span>`:''}${p.tg.map(g=>`<span class="badge type">${t(g)}</span>`).join('')}</div>
 <div class="meta">${t('hours')}: ${hrs(p)}</div><div class="meta">${tel}</div>`;
 if(ex){h+=`<div class="meta">📍 ${p.a||p.c}</div>${p.ty?`<div class="lbl">${t('typ')}</div><p style="margin:4px 0">${p.ty}</p>`:''}<div class="lbl">${t('ids')}</div><p style="margin:4px 0">${p.ix}</p>${p.nt?`<p class="meta">${p.nt}</p>`:''}<div class="meta">${t('lang')}: ${p.lg}</div>`;
  if(st)h+=`<div class="lbl">${t('stock')}</div><div class="stock">${CATS.map((c,i)=>st[i]>=0?`<div class="s ${LV[st[i]]}"><span>${t(c)}</span><b>${t(LV[st[i]])}</b><div class="segs"><i></i><i></i><i></i><i></i></div></div>`:'').join('')}</div>`}
 h+=`<div class="actions" style="margin-top:10px"><button data-a="tog" data-id="${p.id}" aria-expanded="${!!ex}">${ex?'▲':'▼'} ${t('info')}</button><button data-a="sv" data-id="${p.id}" aria-pressed="${sv}">${sv?t('unsave'):t('save')}</button>${p.bk?`<a href="${p.bk}" target="_blank" rel="noopener">${t('book')}</a>`:''}<a class="p" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.a||(p.n+' '+p.c+' CA'))}">${t('dir')}</a></div></article>`;
 return h}
function chip(a,v,label,on){return `<button class="chip" data-a="${a}" data-v="${v}" aria-pressed="${on}">${label}</button>`}
function find(){
 let L=P.filter(p=>{
  const q=S.q.trim().toLowerCase();
  if(q&&!(p.n+' '+p.c).toLowerCase().includes(q))return false;
  if(S.type!=='all'&&p.t!==S.type)return false;
  if(S.tg.includes('openNow')&&!isOpen(p))return false;
  if(!S.tg.filter(g=>g!=='openNow').every(g=>p.tg.includes(g)))return false;
  const st=stock(p);return S.need.every(c=>st?st[CATS.indexOf(c)]>=2:(p.has||[]).includes(c))});
 if(S.sort==='near'&&S.pos)L.sort((a,b)=>dist(a)-dist(b));else L.sort((a,b)=>a.n.localeCompare(b.n));
 const all=P.length,op=P.filter(isOpen).length,lo=P.filter(p=>p.tg.includes('noId')).length;
 return `<div class="stat"><div><strong>${all}</strong>${t('stats1')}</div><div><strong>${op}</strong>${t('stats2')}</div><div><strong>${lo}</strong>${t('stats3')}</div></div>
 <label class="sr" for="q">${t('search')}</label><input id="q" type="search" placeholder="${t('search')}" value="${S.q}">
 <div class="lbl">${t('type')}</div><div class="chips">${chip('type','all',t('all'),S.type==='all')}${['pantry','bank','shelter'].map(k=>chip('type',k,t(k),S.type===k)).join('')}</div>
 <div class="lbl">${t('need')}</div><div class="chips">${CATS.map(c=>chip('need',c,t(c),S.need.includes(c))).join('')}</div>
 <div class="lbl">${t('diet')}</div><div class="chips">${['openNow','noId','veg'].map(g=>chip('tg',g,t(g),S.tg.includes(g))).join('')}</div>
 <div class="chips">${chip('sort','az',t('az'),S.sort==='az')}${chip('sort','near','📍 '+t('near'),S.sort==='near')}</div>
 ${S.posErr?`<p class="meta">${t('nearBad')}</p>`:''}
 <p class="lbl" role="status">${L.length} ${t('res')}</p>${L.length?L.map(card).join(''):`<p class="empty">${t('none')}</p>`}`}
function savedV(){const L=P.filter(p=>S.saved.includes(p.id));return L.length?L.map(card).join(''):`<p class="empty">${t('nosaved')}</p>`}
function partner(){
 const H=`<h2>${t('pTitle')}</h2><p>${t('pInfo')}</p>`,M=S.msg?`<p role="status"><b>${S.msg}</b></p>`:'';
 if(!auth)return H+`<p>${t('noFb')}</p>`;
 if(!S.user)return H+`<label class="lbl" for="em">${t('email')}</label><input id="em" type="email" autocomplete="username" value="${(S.em||'').replace(/"/g,'&quot;')}"><label class="lbl" for="pw">${t('pw')}</label><div style="display:flex;gap:8px"><input id="pw" type="password" autocomplete="current-password" style="min-width:0"><button type="button" data-hold="1" oncontextmenu="return false" aria-label="${t('hold')}" style="white-space:nowrap;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none">👁 ${t('hold')}</button></div><p><button class="chip" data-a="login">${t('login')}</button> <button class="chip" data-a="forgot">${t('forgot')}</button></p>${M}`;
 const p=P.find(x=>x.id===S.pid);
 if(!p)return H+`<p>${t('signedIn')} ${S.user.email}</p>${M}<p><button data-a="logout">${t('logout')}</button></p>`;
 return H+`${(S.pids||[]).length>1?`<label class="lbl" for="pp">${t('pPick')}</label><select id="pp">${S.pids.map(i=>`<option value="${i}" ${i===S.pid?'selected':''}>${(P.find(x=>x.id===i)||{}).n||i}</option>`).join('')}</select>`:`<h3>${p.n}</h3>`}<p class="meta">${t('signedIn')} ${S.user.email}</p>`+CATS.map((c,i)=>`<div class="upd"><span>${t(c)}</span>${[0,1,2,3].map(v=>`<button data-a="dset" data-c="${i}" data-v="${v}" aria-pressed="${S.draft[i]===v}">${t(LV[v])}</button>`).join('')}</div>`).join('')+`<p><button class="chip" data-a="pub">${t('pub')}</button> <button data-a="logout">${t('logout')}</button></p>${M}`}
function render(){
 document.documentElement.lang=S.lang;document.body.classList.toggle('big',S.big);
 document.documentElement.dataset.theme=S.dark?'dark':'light';
 document.title=t('title');
 for(const [id,k] of [['title','title'],['tag','tag'],['note','note']])document.getElementById(id).textContent=t(k);
 document.getElementById('help').innerHTML=t('help');
 const b=document.getElementById('big');b.textContent='A+ '+t('big');b.setAttribute('aria-pressed',S.big);
 const th=document.getElementById('theme');th.textContent='◐ '+t('dark');th.setAttribute('aria-pressed',S.dark);
 document.getElementById('lang').value=S.lang;
 document.getElementById('tabs').innerHTML=[['find',t('find')],['saved',t('saved')+(S.saved.length?' ('+S.saved.length+')':'')],['partner',t('partner')]].map(([k,l])=>`<button role="tab" data-a="tab" data-v="${k}" aria-selected="${S.tab===k}">${l}</button>`).join('');
 const m=document.getElementById('main'),fq=document.activeElement&&document.activeElement.id==='q';
 m.innerHTML=S.tab==='find'?find():S.tab==='saved'?savedV():partner();
 if(fq){const q=document.getElementById('q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v,id=+el.dataset.id;
 if(a==='tab')S.tab=v;
 else if(a==='type')S.type=v;
 else if(a==='need'||a==='tg'){const arr=S[a];S[a]=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v]}
 else if(a==='sort'){if(v==='near'){S.sort='near';S.posErr=false;if(!S.pos){navigator.geolocation?navigator.geolocation.getCurrentPosition(g=>{S.pos={la:g.coords.latitude,lo:g.coords.longitude};render()},()=>{S.sort='az';S.posErr=true;render()},{timeout:8000}):(S.sort='az',S.posErr=true)}}else S.sort='az'}
 else if(a==='tog')S.open[id]=!S.open[id];
 else if(a==='sv'){S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):[...S.saved,id];store()}
 else if(a==='dset'){S.draft[+el.dataset.c]=+v;S.msg=''}
 else if(a==='login'){S.msg='';const e=document.getElementById('em').value.trim(),w=document.getElementById('pw').value;S.em=e;auth.signInWithEmailAndPassword(e,w).catch(()=>{S.msg=t('badLogin');render()})}
 else if(a==='forgot'){const em=document.getElementById('em').value.trim();S.em=em;if(!em){S.msg=t('needEmail')}else{S.msg='';auth.sendPasswordResetEmail(em).then(()=>{S.msg=t('resetSent');render()}).catch(()=>{S.msg=t('needEmail');render()})}}
 else if(a==='logout'){auth.signOut()}
 else if(a==='pub'){db.collection('stock').doc(String(S.pid)).set({levels:S.draft,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{S.msg=t('saved2');render()}).catch(()=>{S.msg=t('fail');render()})}
  render()});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;render()}});
document.addEventListener('change',e=>{if(e.target.id==='pp'){selPid(+e.target.value);S.msg='';render()}if(e.target.id==='lang'){S.lang=e.target.value;store();render()}});
document.getElementById('big').onclick=()=>{S.big=!S.big;store();render()};
document.getElementById('theme').onclick=()=>{S.dark=!S.dark;store();render()};
if(!localStorage.getItem('spn')&&matchMedia('(prefers-color-scheme:dark)').matches)S.dark=true;
const pwShow=on=>{const p=document.getElementById('pw');if(p)p.type=on?'text':'password'};
document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-hold]')){e.preventDefault();pwShow(true)}});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>pwShow(false)));
window.addEventListener('blur',()=>pwShow(false));
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('[data-hold]')&&(e.key===' '||e.key==='Enter')){e.preventDefault();pwShow(true)}});
document.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')pwShow(false)});
const selPid=id=>{S.pid=id;const l=S.live[id];S.draft=l?[...l.levels]:Array(7).fill(-1)};
let auth=null,db=null;
try{if(window.firebase){firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();
 db.collection('stock').onSnapshot(snap=>{const L={};snap.forEach(d=>{const x=d.data(),ts=x.updatedAt&&x.updatedAt.toDate();if(ts&&Date.now()-ts<864e5&&Array.isArray(x.levels))L[+d.id]={levels:x.levels,ts}});S.live=L;
  const a=document.activeElement;if(!(a&&/INPUT|SELECT/.test(a.tagName)&&a.id!=='q'))render()},()=>{});
 auth.onAuthStateChanged(u=>{S.user=u;S.pid=null;S.msg='';
  if(u){db.collection('partners').doc(u.uid).get().then(d=>{if(d.exists){const x=d.data();S.pids=(x.pantryIds||[x.pantryId]).map(Number);selPid(S.pids[0])}else S.msg=t('noLink');render()}).catch(()=>{S.msg=t('noLink');render()})}else render()})}}catch(e){auth=null;db=null}
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
